name: Cinematic hero staging QA
on:
  push:
    branches: [feature/cinematic-hero-2026-10-22]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck and Astro validation
        run: npm run check
      - name: Build static website
        run: npm run build
      - name: Smoke QA
        run: npm run test:smoke
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser and responsive hero QA
        run: node tests/cinematic-hero-ux.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinematic-hero-preview
          path: artifacts/cinematic/
          retention-days: 14
