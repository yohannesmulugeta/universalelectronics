name: Immersive hero visual QA
on:
  push:
    branches: [feature/immersive-hero-2026-10-22]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Astro & TypeScript
        run: npm run check
      - name: Static production build
        run: npm run build
      - name: Site smoke tests
        run: npm run test:smoke
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Desktop / tablet / mobile / reduced motion tests
        run: node tests/cinematic-hero-ux.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-immersive-hero-preview
          path: artifacts/immersive/
          retention-days: 14
