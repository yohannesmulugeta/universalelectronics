name: Uploaded hero video QA
on:
  push:
    branches: [feature/hero-uploaded-video-2026-10-22]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check Astro and TypeScript
        run: npm run check
      - name: Build website
        run: npm run build
      - name: Verify catalog, SEO and generated assets
        run: npm run test:smoke
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Test desktop/mobile video playback and UI
        run: node tests/cinematic-hero-ux.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uploaded-hero-video-previews
          path: artifacts/cinematic/
          retention-days: 14
