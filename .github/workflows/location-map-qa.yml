name: Contact map staging QA
on:
  push:
    branches: [feature/contact-location-map-2026-10-22]
  workflow_dispatch:

permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Astro and TypeScript validation
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Smoke tests
        run: npm run test:smoke
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Verify contact map on desktop and mobile
        run: node tests/location-map-ux.cjs
      - name: Store screenshot previews
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-location-map-preview
          path: artifacts/location-map/
          retention-days: 14
