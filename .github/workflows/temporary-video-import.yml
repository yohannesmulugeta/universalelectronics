name: One-time hero clip import
on:
  push:
    branches: [feature/hero-uploaded-video-2026-10-22]
permissions:
  contents: write
jobs:
  import-video:
    if: "!startsWith(github.event.head_commit.message, 'Import uploaded optimized hero video')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install media tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Fetch user-provided video from secure temporary asset bridge
        run: |
          curl --fail --location --silent --show-error --max-time 50 'https://at.adobe.com/daC8auSdwW0ZRNgm' -o /tmp/hero-original.mp4
          file /tmp/hero-original.mp4
          ffprobe -v error -show_entries format=duration,size -of default=nw=1 /tmp/hero-original.mp4
      - name: Optimize and prepare no-audio looping video and poster
        run: |
          mkdir -p public/assets/hero
          ffmpeg -hide_banner -loglevel error -i /tmp/hero-original.mp4 -vf 'fps=24,scale=1600:-2:flags=lanczos' -c:v libx264 -preset slow -crf 30 -pix_fmt yuv420p -movflags +faststart -an -y public/assets/hero/universal-energy-loop.mp4
          ffmpeg -hide_banner -loglevel error -ss 1.5 -i /tmp/hero-original.mp4 -frames:v 1 -vf 'scale=1600:-2:flags=lanczos' -c:v libwebp -quality 81 -y public/assets/hero/universal-energy-poster.webp
          test "$(stat -c%s public/assets/hero/universal-energy-loop.mp4)" -lt 1500000
      - name: Save media assets to development branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f public/assets/hero/universal-energy-loop.mp4 public/assets/hero/universal-energy-poster.webp
          git commit -m 'Import uploaded optimized hero video and poster'
          git push origin HEAD:feature/hero-uploaded-video-2026-10-22
