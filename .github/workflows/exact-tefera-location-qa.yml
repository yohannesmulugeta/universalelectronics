name: Exact Tefera Google Maps location QA
on:
  push:
    branches: [feature/exact-tefera-google-map-2026-10-22]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript and Astro
        run: npm run check
      - name: Build production site
        run: npm run build
      - name: Smoke checks including exact place CID
        run: npm run test:smoke
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Map location and mobile/desktop verification
        run: node tests/location-map-ux.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-tefera-place-screenshots
          path: artifacts/location-map/
          retention-days: 14
