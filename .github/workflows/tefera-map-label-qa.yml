name: Tefera Building map label QA
on:
  push:
    branches: [feature/tefera-building-location-fix-2026-10-22]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate Astro and TypeScript
        run: npm run check
      - name: Build production site
        run: npm run build
      - name: Smoke test map and content
        run: npm run test:smoke
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Responsive map QA
        run: node tests/location-map-ux.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corrected-tefera-map-screenshots
          path: artifacts/location-map/
          retention-days: 14
